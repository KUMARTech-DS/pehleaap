apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: pehle-aap
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: IMAGE_PLACEHOLDER
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef: { name: app-secrets }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: pehle-db-app, key: uri }
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: pehle-aap
  labels: { app: web }
spec:
  selector: { app: web }
  ports:
    - name: http
      port: 80
      targetPort: 3000
  type: ClusterIP
